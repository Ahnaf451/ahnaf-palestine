<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Libri e Film consigliati</title>
  <style>
    :root {
      --verde: #005826;
      --rosso: #ce1126;
      --rosso-scuro: #9f0d1d;
      --sfondo: #f4f4f4;
      --testo: #222;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--sfondo);
      color: var(--testo);
    }

    main {
      width: min(1200px, calc(100% - 32px));
      margin: 28px auto;
      padding: 32px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--rosso);
      color: white;
      text-decoration: none;
      font-weight: 700;
      transition: background-color 0.25s ease, transform 0.25s ease;
    }

    .back-link:hover {
      background: var(--rosso-scuro);
      transform: translateY(-2px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 34px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 5px solid var(--verde);
      padding-bottom: 10px;
    }

    .intro {
      margin: 0 0 28px;
      font-size: 17px;
      line-height: 1.7;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .media-card {
      border: none;
      padding: 0;
      background: white;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.14);
      cursor: pointer;
      text-align: left;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .media-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.18);
    }

    .media-card:focus-visible {
      outline: 3px solid var(--rosso);
      outline-offset: 4px;
    }

    .media-cover {
      position: relative;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: #ddd;
    }

    .media-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.45s ease;
    }

    .media-card:hover .media-cover img,
    .media-card[aria-expanded="true"] .media-cover img {
      transform: scale(1.05);
    }

    .media-title {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      margin: 0;
      padding: 18px 16px 16px;
      color: white;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.35;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.82), rgba(0, 0, 0, 0.08));
    }

    .media-details {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.45s ease;
    }

    .media-card[aria-expanded="true"] .media-details {
      grid-template-rows: 1fr;
    }

    .media-details-inner {
      overflow: hidden;
    }

    .media-details-content {
      padding: 18px;
      border-top: 1px solid #ececec;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .media-card[aria-expanded="true"] .media-details-content {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.08s;
    }

    .media-type-row {
      margin-bottom: 10px;
    }

    .media-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .media-type {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef6ef;
      color: var(--verde);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .media-meta {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #fff1f2;
      color: var(--rosso);
      border: 1px solid #f0b8bf;
      font-size: 13px;
      font-weight: 800;
      white-space: normal;
      line-height: 1.3;
    }

    .media-description {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
      color: #454545;
    }

    @media (max-width: 1024px) {
      .media-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      main {
        width: calc(100% - 20px);
        margin: 10px auto;
        padding: 20px 14px;
      }

      h1 {
        font-size: 27px;
      }

      .intro {
        font-size: 16px;
      }

      .media-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .media-title {
        font-size: 18px;
      }

      .media-meta {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="index.html">Torna alla pagina principale</a>

    <h1>Libri e Film consigliati</h1>
    <p class="intro">Clicca su una delle copertine per visualizzare le informazioni sul libro o sul film.</p>

    <section class="media-grid" aria-label="Libri, film e documentari consigliati">
      <button class="media-card" type="button" aria-expanded="false">
        <div class="media-cover">
          <img src="ogni mattina a jenin.jpg" alt="Copertina di Ogni mattina a Jenin" />
          <h2 class="media-title">Ogni mattina a Jenin</h2>
        </div>
        <div class="media-details">
          <div class="media-details-inner">
            <div class="media-details-content">
              <div class="media-type-row">
                <span class="media-type">Libro</span>
              </div>
              <div class="media-meta-row">
                <span class="media-meta">Autrice: Susan Abulhawa</span>
                <span class="media-meta">Anno: 2011</span>
              </div>
              <p class="media-description">Romanzo che racconta la storia di una famiglia palestinese attraverso più generazioni, mostrando l’impatto della guerra, dell’esilio e della perdita sulla memoria e sull’identità familiare.</p>
            </div>
          </div>
        </div>
      </button>

      <button class="media-card" type="button" aria-expanded="false">
        <div class="media-cover">
          <img src="Il suicidio di Israele – Anna Foa.jpg" alt="Copertina di Il suicidio di Israele" />
          <h2 class="media-title">Il suicidio di Israele</h2>
        </div>
        <div class="media-details">
          <div class="media-details-inner">
            <div class="media-details-content">
              <div class="media-type-row">
                <span class="media-type">Libro</span>
              </div>
              <div class="media-meta-row">
                <span class="media-meta">Autrice: Anna Foa</span>
                <span class="media-meta">Anno: 2024</span>
              </div>
              <p class="media-description">Saggio che analizza alcune scelte politiche e storiche di Israele, riflettendo sulle loro conseguenze interne e internazionali nel contesto del conflitto mediorientale.</p>
            </div>
          </div>
        </div>
      </button>

      <button class="media-card" type="button" aria-expanded="false">
        <div class="media-cover">
          <img src="Storia di un abito inglese e di una mucca ebrea.jpg" alt="Copertina di Storia di un abito inglese e di una mucca ebrea" />
          <h2 class="media-title">Storia di un abito inglese e di una mucca ebrea</h2>
        </div>
        <div class="media-details">
          <div class="media-details-inner">
            <div class="media-details-content">
              <div class="media-type-row">
                <span class="media-type">Libro</span>
              </div>
              <div class="media-meta-row">
                <span class="media-meta">Autrice: Suad Amiry</span>
                <span class="media-meta">Anno: 2020</span>
              </div>
              <p class="media-description">Romanzo che usa oggetti, simboli e vicende personali per riflettere su identità culturale, memoria, religione e rapporti tra popoli segnati dal conflitto.</p>
            </div>
          </div>
        </div>
      </button>

      <button class="media-card" type="button" aria-expanded="false">
        <div class="media-cover">
          <img src="Gaza 1956.jpg" alt="Copertina di Gaza 1956" />
          <h2 class="media-title">Gaza 1956</h2>
        </div>
        <div class="media-details">
          <div class="media-details-inner">
            <div class="media-details-content">
              <div class="media-type-row">
                <span class="media-type">Fumetto</span>
              </div>
              <div class="media-meta-row">
                <span class="media-meta">Autore: Joe Sacco</span>
                <span class="media-meta">Anno: 2009</span>
              </div>
              <p class="media-description">Graphic novel storica basata su testimonianze e ricostruzioni giornalistiche, che racconta eventi reali della guerra e la vita dei civili nella Striscia di Gaza.</p>
            </div>
          </div>
        </div>
      </button>

      <button class="media-card" type="button" aria-expanded="false">
        <div class="media-cover">
          <img src="La voce di Hind Rajab.jpg" alt="Locandina de La voce di Hind Rajab" />
          <h2 class="media-title">La voce di Hind Rajab</h2>
        </div>
        <div class="media-details">
          <div class="media-details-inner">
            <div class="media-details-content">
              <div class="media-type-row">
                <span class="media-type">Film</span>
              </div>
              <div class="media-meta-row">
                <span class="media-meta">Regista: Kaouther Ben Hania</span>
                <span class="media-meta">Anno: 2025</span>
              </div>
              <p class="media-description">Film che ricostruisce la vicenda reale di Hind Rajab e mostra, attraverso una storia personale, la dimensione umana e civile della guerra a Gaza.</p>
            </div>
          </div>
        </div>
      </button>

      <button class="media-card" type="button" aria-expanded="false">
        <div class="media-cover">
          <img src="land.jpg" alt="Locandina di No Other Land" />
          <h2 class="media-title">No Other Land</h2>
        </div>
        <div class="media-details">
          <div class="media-details-inner">
            <div class="media-details-content">
              <div class="media-type-row">
                <span class="media-type">Documentario</span>
              </div>
              <div class="media-meta-row">
                <span class="media-meta">Registi: Adra, Ballal, Abraham, Szor</span>
                <span class="media-meta">Anno: 2024</span>
              </div>
              <p class="media-description">Documentario che segue la vita quotidiana nei territori occupati, mostrando demolizioni, resistenza civile e conseguenze concrete del conflitto sulle comunità locali.</p>
            </div>
          </div>
        </div>
      </button>
    </section>
  </main>

  <script>
    const cards = document.querySelectorAll(".media-card");

    cards.forEach(function (card) {
      card.addEventListener("click", function () {
        const isExpanded = card.getAttribute("aria-expanded") === "true";
        card.setAttribute("aria-expanded", String(!isExpanded));
      });
    });
  </script>
</body>
</html>
